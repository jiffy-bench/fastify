# Replay farm copy of upstream's ci.yml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

name: ci

on:
  push:
    branches:
      - main
      - next
      - '*.x'
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      nodejs-version:
        description: 'Node.js version to use (e.g., 24.0.0-rc.1)'
        required: true
        type: string

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage-nix:
    permissions:
      contents: read
    uses: ./.github/workflows/coverage-nix.yml

  test-unit:
    needs:
      - coverage-nix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        node-version: [24, 26]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package.json
          check-latest: true

      - name: Install
        run: |
          npm install --ignore-scripts
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@a64eb2feaf04f8407498065120422e6ff30d33a4
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: node-test
          test-paths: test/
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          test-step: Run tests
          report: .jiffy/report-node-test.json
      - name: Tensile node:test recorder
        id: tensile-record
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (matrix.node-version == 24) }}
        continue-on-error: true
        uses: rsyed94/tensile-action/node-test@a64eb2feaf04f8407498065120422e6ff30d33a4
        with:
          step: setup
      - name: Run tests
        run: |
          npm run unit
        env:
          NODE_OPTIONS: ${{ steps.tensile-record.outputs.node-options || env.NODE_OPTIONS }}
      - name: Tensile node:test collect
        if: ${{ !cancelled() && steps.tensile-record.outcome == 'success' }}
        continue-on-error: true
        uses: rsyed94/tensile-action/node-test@a64eb2feaf04f8407498065120422e6ff30d33a4
        with:
          step: collect
      - name: "Replay farm: send the coverage to Tensile"
        if: ${{ success() && steps.tensile-record.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SERVER: https://jiffy-app-production.up.railway.app
          PART: test-unit-node-test
        run: |
          set -euo pipefail
          [ -s .jiffy/coverage-node-test.json ] || { echo "::warning::no node:test coverage to send"; exit 0; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jiffy" | jq -r .value)
          echo "::add-mask::$token"
          put() { curl -sS --fail-with-body -X PUT -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @"$1" "$SERVER/v1/maps/$GITHUB_REPOSITORY/$GITHUB_SHA/$2/$3"; echo; }
          put .jiffy/coverage-node-test.json parts "$PART"
          [ ! -s .jiffy/report-node-test.json ] || put .jiffy/report-node-test.json durations "$PART-report"

  test-types:
    needs:
      - coverage-nix
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
          check-latest: true

      - name: Install
        run: |
          npm install --ignore-scripts

      - name: Run type tests
        run: |
          npm run test:types
        env:
          NODE_OPTIONS: no-network-family-autoselection

  test-pino-compat:
    name: Test pino compatibility
    needs:
      - coverage-nix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        pino-version: ['^9', '^10']

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package.json
          check-latest: true

      - name: Install dependencies
        run: |
          npm install --ignore-scripts

      - name: Install pino ${{ matrix.pino-version }}
        run: |
          npm install --ignore-scripts --no-save pino@${{ matrix.pino-version }}

      - name: Run unit tests
        run: |
          npm run unit

      - name: Run type tests
        run: |
          npm run test:types
        env:
          NODE_OPTIONS: no-network-family-autoselection

  package:
    needs:
      - test-types
      - test-unit
      - test-pino-compat
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package.json
          check-latest: true
      - name: install fastify
        run: |
          npm install --ignore-scripts
      - name: install webpack stack
        run: |
          cd test/bundler/webpack && npm install --ignore-scripts
      - name: Test webpack bundle
        run: |
          cd test/bundler/webpack && npm run test
      - name: install esbuild stack
        run: |
          cd test/bundler/esbuild && npm install --ignore-scripts
      - name: Test esbuild bundle
        run: |
          cd test/bundler/esbuild && npm run test
